name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  quality:
    # The project is developed on Windows and run in both environments;
    # cross-platform regressions (paths, shells, signals) are the most common
    # breakage class, so PRs gate on both OSes.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Validate agents, commands, and skills
        run: npm run check:content

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Verify tool runtime dependencies
        run: npm run tools:verify

      - name: Family benchmark rule checks
        run: npm run benchmark:lint

      - name: Benchmark scenario contracts (replay)
        run: npm run benchmark:replay

      - name: Build plugin bundle
        run: npm run build:plugin

      - name: Verify release package
        run: npm run release:check

  coverage:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
